<!doctype html>
<!--
  html { font-size: 62.5% } - the "rem trick", on a huge share of modern
  themes. It makes 1rem 10px for easy arithmetic, so the body's own font size
  computes to 10px, while every paragraph a visitor reads is 1.7rem = 17px.
  Reading the body's font size reported this as small, hard-to-read text.
-->
<html lang="en" style="font-size:62.5%"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northland Pet Grooming</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  .wrap { padding: 20px; }
  h1 { font-size: 3.4rem; }
  p, li, a { font-size: 1.7rem; line-height: 1.6; }
  a { display: inline-block; padding: 12px 0; }
</style></head>
<body><div class="wrap">
  <h1>Northland Pet Grooming</h1>
  <p>Baths, cuts and nail trims for dogs and cats, by appointment six days a week.</p>
  <ul><li>Full groom from $45</li><li>Bath and brush from $30</li><li>Nail trim, walk-in, $12</li></ul>
  <p><a href="tel:8165550188">Call (816) 555-0188</a></p>
</div></body></html>
