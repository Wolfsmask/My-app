# ---------------------------------------------------------------------------
# MBOnyx Studio — Netlify configuration
# ---------------------------------------------------------------------------
# The site is static HTML, so there is no build step. Everything here is
# headers and redirects: long-lived caching for fingerprint-stable assets,
# and a conservative security baseline.
# ---------------------------------------------------------------------------

[build]
  # dist/ holds only the public site. Publishing the repository root put every
  # file in the project on the live site, including the docs about the business
  # side of this, which is not something to hand a prospect.
  publish = "dist"
  command = "node tools/build-site.mjs"

# --- Security baseline, applied to every response --------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Everything is same-origin and inline; no third-party script or font hosts.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'"

# --- Fonts: immutable, never change without a filename change --------------
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# --- Screenshots and brand images ------------------------------------------
[[headers]]
  for = "/assets/work/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# --- HTML: always revalidate so edits go live immediately ------------------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- Pretty URLs for the concept builds ------------------------------------
[[redirects]]
  from = "/work/:slug"
  to = "/work/:slug.html"
  status = 200

[[redirects]]
  from = "/work"
  to = "/#work"
  status = 301
